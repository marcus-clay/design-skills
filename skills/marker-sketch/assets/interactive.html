<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>__TITLE__</title>
<style>
/*__FONT__*/
:root{--paper:__PAPER__;--ink:#161616;--gray:#80838a;--sh:#c6c9ce;--blue:#2547a8;--hl:#dde37c}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);
  font-family:'Patrick Hand','Caveat','Segoe Print','Bradley Hand','Marker Felt','Comic Sans MS',cursive}
body{display:flex;flex-direction:column;align-items:center;padding:10px 16px 12px;gap:8px}
#top{width:100%;max-width:1600px;display:flex;align-items:baseline;gap:18px;min-height:34px}
#ttl{font-size:26px;margin:0;font-weight:400}
#note{font-size:21px;color:var(--blue);flex:1;text-align:right}
#stage{position:relative;width:100%;max-width:1600px;flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center}
#sketch{display:block;width:100%;height:100%;max-height:100%;touch-action:none}
#bar{width:100%;max-width:1600px;display:flex;flex-direction:column;gap:8px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center}
.row.small{justify-content:flex-start}
.sp{flex:1}
button{font:inherit;font-size:22px;color:var(--ink);background:var(--paper);border:2.5px solid var(--ink);border-radius:14px 18px 15px 17px;
  padding:3px 16px 4px;cursor:pointer;box-shadow:3px 4px 0 var(--sh);line-height:1.15;transition:transform .08s,box-shadow .08s}
button:hover{transform:translate(-1px,-1px);box-shadow:4px 5px 0 var(--sh)}
button:active{transform:translate(2px,3px);box-shadow:1px 1px 0 var(--sh)}
button:disabled{opacity:.35;cursor:default;box-shadow:none;transform:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
button.chip.on{background:var(--hl);font-weight:400}
button.chip.layer{font-size:19px;padding:1px 12px 2px;border-style:dashed;box-shadow:none}
button.chip.layer.on{border-style:solid;background:var(--sh)}
button.play{min-width:58px}
.small button{font-size:18px;padding:1px 12px 2px}
input.scrub{width:min(560px,90%);align-self:center;accent-color:#161616}
.drag{cursor:grab}.drag.grab{cursor:grabbing}
input.edit{position:absolute;font:inherit;font-size:30px;text-align:center;background:#fffef6;border:2.5px solid var(--blue);border-radius:10px;padding:0 8px;z-index:3}
textarea.fallback{position:absolute;inset:8% 8%;z-index:4;font:14px/1.3 ui-monospace,monospace;padding:10px;border:2.5px solid var(--ink);background:#fffef6}
html[data-q=low] #drawing{filter:none}
@media (max-width:700px){#ttl{font-size:21px}#note{font-size:17px}button{font-size:18px}}
@media print{#bar,#top{display:none}}
</style>
</head>
<body>
<div id="top"><h1 id="ttl"></h1><div id="note" aria-live="polite"></div></div>
<div id="stage">
__SVG__
</div>
<div id="bar"></div>
<script id="scenes" type="application/json">__SCENES__</script>
<script>
/*__RUNTIME__*/
</script>
</body>
</html>
